# The dev page's "Real checker": the example checks plus a system and a result_file check, three mqtt checks against
# the compose `mosquitto` service, and three Docker checks (containers, image updates, vulnerabilities).
# compose.dev.yaml copies this next to the other examples as /tmp/ex/config.toml (demo.sqlite, my_checks.py).

[checker]
name = "dev-checker"
listen = "127.0.0.1:8099"
state = "dev-state.sqlite"

[defaults]
interval = "30s"
show_after = { unknown = "1m" }

[mqtt.dev]
host = "mosquitto"

[[check]]
id = "ping.localhost"
type = "ping"
label = "This machine"
group = "network"
host = "localhost"
count = 2
warn = 50
crit = 200
show_after = { warn = "1m", crit = "1m", unknown = "2m" }

[[check]]
id = "demo.heartbeat"
type = "sql_age"
label = "Demo heartbeat"
group = "demo"
database = "sqlite:demo.sqlite"
query = "SELECT max(written_at) FROM heartbeat"
warn = "1m"
crit = "5m"
summary = "last heartbeat {age} ago"

[[check]]
id = "demo.nightly"
type = "sql_age"
label = "Nightly job (stale on purpose)"
group = "demo"
database = "sqlite:demo.sqlite"
query = "SELECT max(finished_at) FROM nightly_runs WHERE ok = 1"
timezone = "UTC"
warn = "26h"
crit = "50h"

[[check]]
id = "custom.disk"
type = "python"
label = "Disk used"
group = "demo"
function = "my_checks:disk_used_percent"
path = "."
warn = 85
crit = 95
summary = "{value} % used"

# system: reads /proc inside the container (load of the Docker VM, per CPU). Linux only; green on the dev page.
[[check]]
id = "system.load"
type = "system"
label = "Load (per CPU)"
group = "system"
measure = "load"
warn = 1.5
crit = 4

# result_file: update_demo_db.py --loop rewrites demo_result.json every 20 s; its own ts and ttl are served as they are.
[[check]]
id = "demo.job"
type = "result_file"
label = "Demo job (a result file)"
group = "demo"
path = "demo_result.json"

# mqtt: a heartbeat every 10 s, a retained Last Will, and a topic nobody publishes to.
[[check]]
id = "mqtt.heartbeat"
type = "mqtt"
label = "MQTT heartbeat"
group = "mqtt"
broker = "dev"
topic = "demo/heartbeat"
interval = "10s"
warn = "30s"
crit = "1m"

[[check]]
id = "mqtt.plug"
type = "mqtt"
label = "MQTT plug (retained)"
group = "mqtt"
broker = "dev"
topic = "demo/plug/LWT"
interval = "10s"
levels = { Online = "ok", Offline = "crit" }

[[check]]
id = "mqtt.silent"
type = "mqtt"
label = "MQTT silent topic"
group = "mqtt"
broker = "dev"
topic = "demo/never"
interval = "10s"
warn = "20s"
crit = "40s"

# docker_status, docker_updates and image_vulns through the compose `docker-socket-proxy` (only the GET paths they use).
# docker_updates asks Docker Hub / ghcr.io about the dev stack's own public images, once a day.
[[check]]
id = "docker.containers"
type = "docker_status"
label = "Containers"
group = "docker"
docker = "tcp://docker-socket-proxy:2375"

[[check]]
id = "docker.updates"
type = "docker_updates"
label = "Image updates"
group = "docker"
docker = "tcp://docker-socket-proxy:2375"
interval = "1d"
timeout = "60s"
show_after = { unknown = "2d" }   # a registry that is down for a day doesn't turn the card grey

# image_vulns on the dev stack's own images, with the schedule of checker/README.md's example (explained there).
# Trivy comes from the compose `trivy-bin` service; it reads local images through the proxy (DOCKER_HOST). The full
# list is at http://localhost:8099/vulns. The first run downloads Trivy's database (a few minutes).
[[check]]
id = "docker.vulns"
type = "image_vulns"
label = "Vulnerabilities"
group = "docker"
docker = "tcp://docker-socket-proxy:2375"
interval = "1d"
timeout = "15m"
trivy = "/trivy/trivy"
cache_dir = "/trivy-cache"
env = ["HOME", "DOCKER_HOST"]
show_after = { unknown = "3d" }

[check.schedule.update]
CRITICAL = { warn = "0d",  crit = "3d" }
HIGH     = { warn = "7d",  crit = "30d" }
MEDIUM   = { warn = "30d", crit = "never" }

[check.schedule.rebuild]
CRITICAL = { warn = "0d",  crit = "7d" }
HIGH     = { warn = "14d", crit = "never" }
MEDIUM   = { warn = "60d", crit = "never" }

[check.schedule.waiting]
CRITICAL = { warn = "0d",  crit = "never" }
HIGH     = { warn = "0d",  crit = "never" }

[check.schedule.no_fix]
CRITICAL = { warn = "never", crit = "0d" }
