services:
  # Node tooling. Node is not needed on the host:
  #   docker compose -f compose.dev.yaml run --rm node npm install
  #   docker compose -f compose.dev.yaml run --rm node npm test
  #   docker compose -f compose.dev.yaml run --rm node npm run lint
  node:
    image: node:24-alpine
    profiles: [tools]
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules # a named volume: npm install on a Windows bind mount is slow
    command: npm test

  # The demo results server: times are shifted on every request (--demo) so that the display shows every level.
  demo:
    image: python:3.14-alpine
    command: python /demo/serve.py --demo --host 0.0.0.0 --port 8099
    volumes:
      - ./examples/hand-written:/demo:ro

  # A broker for the mqtt checks (anonymous, no persistence) and a tiny publisher: a heartbeat on demo/heartbeat every
  # 10 s and a retained "Online" on demo/plug/LWT. Nobody publishes demo/never: that card turns amber, then red.
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    volumes:
      - ./checker/tests/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  mqtt-publisher:
    image: eclipse-mosquitto:2.0.22
    depends_on: [mosquitto]
    restart: on-failure
    entrypoint:
      - sh
      - -c
      - |
        sleep 2
        mosquitto_pub -h mosquitto -t demo/plug/LWT -r -m Online
        while true; do mosquitto_pub -h mosquitto -t demo/heartbeat -m tick; sleep 10; done

  # The checker's only way to Docker (docker_status, docker_updates, image_vulns, and Trivy reading local images):
  # exactly the GET paths they use, and HEAD /_ping for Trivy; every other path, method and client is refused. Not a
  # container's details (/containers/{id}/json): they hold its whole environment, so usually its passwords. Mounting
  # the socket :ro does not make the API read-only; the proxy does. docs/checker.md, "Docker access".
  # The checker reaches it at tcp://docker-socket-proxy:2375.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.2
    # Its own user, with the socket's group to open it: 0 on Docker Desktop. On Linux the socket's group is `docker`,
    # whose number differs per machine: DOCKER_SOCKET_GID=$(stat -c %g /var/run/docker.sock)
    user: "65534:${DOCKER_SOCKET_GID:-0}"
    command:
      - "-listenip=0.0.0.0"
      - "-allowfrom=checker"
      - "-allowGET=(/v1\\.[0-9]+)?/(containers/json|events|images/json|images/.+/json|images/.+/history|images/get)"
      - "-allowHEAD=(/v1\\.[0-9]+)?/_ping"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Trivy for the image_vulns check: the checker's image has none, so this one-shot copies the binary of Trivy's own
  # image into a volume the checker mounts (again on every `up`, so a new tag here is picked up). It then exits.
  trivy-bin:
    image: aquasec/trivy:0.76.2
    entrypoint: ["cp", "/usr/local/bin/trivy", "/trivy/trivy"]
    volumes:
      - trivy_bin:/trivy

  # The real checker, running dev/checker.toml: the example checks (ping localhost, two sql_age checks on a SQLite file
  # that update_demo_db.py keeps fresh, a custom Python function) plus three mqtt checks against `mosquitto` and three
  # docker checks through `docker-socket-proxy` (image_vulns with Trivy from `trivy-bin`, which reads the local images
  # through the proxy too, at the check's `docker` address; its database is kept in a volume, the first scan downloads it).
  # MagicMirror reaches it inside the compose network (http://checker:8099); its port is also published to this PC only
  # (127.0.0.1), for its own pages in a browser: http://localhost:8099/, /results and /vulns. The `demo` service also
  # listens on 8099 inside the network and stays unpublished: only one of them can have the PC's port. The examples
  # are copied to /tmp so the checker's repo mount can stay read-only.
  #   docker compose -f compose.dev.yaml up -d checker
  checker:
    image: ghcr.io/astral-sh/uv:0.13.7-python3.14-alpine
    depends_on:
      mosquitto:
        condition: service_started
      mqtt-publisher:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
      trivy-bin:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8099:8099"   # its own pages (/, /results, /vulns) in a browser on this PC; not on the network
    working_dir: /tmp
    environment:
      UV_PROJECT_ENVIRONMENT: /tmp/venv
      UV_CACHE_DIR: /tmp/uv-cache
      UV_LINK_MODE: copy
      HOME: /tmp
    volumes:
      - ./checker:/checker:ro
      - ./dev/checker.toml:/dev-checker.toml:ro
      - trivy_bin:/trivy:ro
      - trivy_cache:/trivy-cache
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/ex && cp -r /checker/examples/. /tmp/ex/
        cp /dev-checker.toml /tmp/ex/config.toml
        sed -i 's/127.0.0.1:8099/0.0.0.0:8099/' /tmp/ex/config.toml
        python /tmp/ex/update_demo_db.py --loop > /dev/null &
        sleep 1
        exec uv run --frozen --no-dev --extra mqtt --project /checker anystatus-checker run /tmp/ex/config.toml
  # Real MagicMirror, server only. Open http://localhost:8080
  #   docker compose -f compose.dev.yaml up magicmirror
  magicmirror:
    image: karsten13/magicmirror:alpine-v2.38.0 # alpine tags run server only
    depends_on: [demo, checker]
    ports:
      - "8080:8080"
    environment:
      TZ: UTC
    volumes:
      - ./dev:/opt/magic_mirror/config # config.js and custom.css (the dev page's layout); MagicMirror writes basepath.js here (git-ignored)
      - .:/opt/magic_mirror/modules/MMM-AnyStatus:ro

volumes:
  node_modules:
    name: mmm-anystatus-node_modules
  trivy_bin:
    name: mmm-anystatus-trivy-bin
  trivy_cache:
    name: mmm-anystatus-trivy-cache # Trivy's database: downloaded once, not on every start
