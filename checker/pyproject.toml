[project]
name = "mmm-anystatus-checker"
version = "0.1.0"
description = "The checker for MMM-AnyStatus: runs checks, decides their level, serves the results over HTTP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
# The core is standard library only. tzdata is the one exception, and only on Windows, which ships no time zone
# database (zoneinfo needs it for `timezone = "Europe/Brussels"`).
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
anystatus-checker = "anystatus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anystatus"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "jsonschema>=4.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # the formatter wraps code; long docstring lines are fine

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]

