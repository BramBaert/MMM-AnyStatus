# A config that runs without any setup. From the checker/ folder:
#
#   uv run examples/update_demo_db.py            # once: creates examples/demo.sqlite (see the README)
#   uv run anystatus-checker run examples/config.toml
#   curl http://127.0.0.1:8099/results
#
# Or without waiting for intervals:  uv run anystatus-checker once examples/config.toml

[checker]
name = "example-checker"
listen = "127.0.0.1:8099"   # localhost only; results can reveal internal names
state = "example-state.sqlite"   # relative to this file

[defaults]
interval = "30s"
# show_after: how long a level must last before it shows (s, m, h, d; "0d" = at once, "never" = skip that level).
# A level without one shows at once, and getting better always shows at once. Here: a check that fails once or twice
# (a blip) doesn't turn its card grey; one that fails for a minute does.
show_after = { unknown = "1m" }

# 1. ping: runs the system `ping`. Value: the average round trip in ms.
[[check]]
id = "ping.localhost"
type = "ping"
label = "This machine"
group = "network"
host = "localhost"
count = 2
warn = 50                   # ms
crit = 200
# A slow or dropped ping now and then is normal: show amber or red only when it lasts a minute, grey after two.
# Per level, this replaces what [defaults] says (unknown); levels it doesn't name keep the default's.
show_after = { warn = "1m", crit = "1m", unknown = "2m" }

# 2. sql_age: how old is the newest timestamp in a table? The script update_demo_db.py keeps this one fresh.
[[check]]
id = "demo.heartbeat"
type = "sql_age"
label = "Demo heartbeat"
group = "demo"
database = "sqlite:demo.sqlite"          # relative to this file; sqlite:///abs/path.db is absolute
query = "SELECT max(written_at) FROM heartbeat"
warn = "1m"                 # durations: "30s", "5m", "2h", "1d", "1h30m"
crit = "5m"
summary = "last heartbeat {age} ago"

# 3. sql_age on purpose-stale data: the nightly job "last ran" 3 days ago, so this one is red.
#    The time in the table has no offset ("2026-11-08 02:15:00"): `timezone` says which clock wrote it.
[[check]]
id = "demo.nightly"
type = "sql_age"
label = "Nightly job (stale on purpose)"
group = "demo"
interval = "5m"             # no show_after for warn or crit: a missed nightly run shows at once
database = "sqlite:demo.sqlite"
query = "SELECT max(finished_at) FROM nightly_runs WHERE ok = 1"
timezone = "UTC"
warn = "26h"                # one missed nightly run is amber...
crit = "50h"                # ...two is red

# 4. python: your own function. Any other key (here `path`) is passed to it.
[[check]]
id = "custom.disk"
type = "python"
label = "Disk used"
group = "demo"
function = "my_checks:disk_used_percent"
path = "."                  # the folder this config lives in: where the function is imported from, too
warn = 85
crit = 95
summary = "{value} % used"

# 5. http: one GET. Here it asks this checker's own /results and reads a time out of the answer, so it needs no
#    outside server. Under `run` it is green; `once` serves nothing, so there it reports "connection refused".
[[check]]
id = "http.self"
type = "http"
label = "This checker's /results"
group = "demo"
url = "http://127.0.0.1:8099/results"
json = "results.0.ts"       # a dotted path into the JSON answer; list items by number
value_is = "time"           # the value is a timestamp: its age is compared with the limits
warn = "2m"
crit = "5m"
summary = "first result written {age} ago"

# 6. disk: how full is the disk behind a path? Default limits: amber at 85 %, red at 95 %. A relative path is relative
#    to this file. `measure = "free"` would report the free GB instead.
[[check]]
id = "disk.examples"
type = "disk"
label = "Disk of the examples folder"
group = "demo"
path = "."

# 7. file_age: the newest file matching a glob counts. Here the SQLite file that update_demo_db.py writes to, so
#    it is green while the loop runs and turns amber, then red, when it stops. `min_size = "1KB"` would ignore stubs.
[[check]]
id = "file.demo"
type = "file_age"
label = "Demo database file"
group = "demo"
path = "demo.sqlite"        # a glob such as "backups/*.tar.zst" works too
warn = "2m"
crit = "10m"

# 8. result_file: another program writes a result in the SPEC format, the checker serves it as it is (no limits, no
#    show_after, the file's own ts and ttl). update_demo_db.py rewrites demo_result.json every run; stop it and the
#    card turns grey after the file's ttl (90 s), because nothing makes it look fresh.
[[check]]
id = "demo.job"
type = "result_file"
label = "Demo job (a result file)"
group = "demo"
path = "demo_result.json"
